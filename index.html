<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Store</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        #app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
        }

        .app-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .app-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 5px 0;
        }

        .app-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .download-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #005bb5;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>App Store</h1>
        <p>Download the latest apps directly from Firebase</p>
    </header>

    <main id="app-grid">
        <div id="loading">Loading apps from database...</div>
    </main>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your provided web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD44NWaXEYqR8b_8x5YnAcRQXK44OhtWdA",
            authDomain: "app-store-c8510.firebaseapp.com",
            projectId: "app-store-c8510",
            storageBucket: "app-store-c8510.firebasestorage.app",
            messagingSenderId: "13153104569",
            appId: "1:13153104569:web:1ea598b6e165879c162168",
            measurementId: "G-38J9DPWENY"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        
        // Initialize Realtime Database
        const db = getDatabase(app);

        // Reference the "apps" node in your database
        const appsRef = ref(db, 'apps');
        const appGrid = document.getElementById('app-grid');

        // Listen for real-time updates
        onValue(appsRef, (snapshot) => {
            appGrid.innerHTML = ''; // Clear loading text or old data
            
            const data = snapshot.val();

            if (data) {
                // Loop through each app in the database
                Object.keys(data).forEach(appId => {
                    const appData = data[appId];
                    
                    // Create the HTML elements for the app card
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    
                    card.innerHTML = `
                        <div class="app-icon">${appData.icon || '📱'}</div>
                        <h2 class="app-name">${appData.name}</h2>
                        <p class="app-desc">${appData.description}</p>
                        <a href="${appData.downloadUrl}" class="download-btn" target="_blank" rel="noopener noreferrer">Download</a>
                    `;
                    
                    appGrid.appendChild(card);
                });
            } else {
                appGrid.innerHTML = '<div id="loading">No apps found in the database.</div>';
            }
        }, (error) => {
            console.error("Error fetching data:", error);
            appGrid.innerHTML = `<div id="loading" style="color: red;">Error connecting to database. Make sure your Firebase security rules allow reading!</div>`;
        });
    </script>
</body>
</html>
